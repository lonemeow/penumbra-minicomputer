# $NetBSD$
# Penumbra multiuser image customization script used by mkimage
#

board=penumbra_multiuser

. ${DIR}/conf/penumbra.conf

# The base image stops at a single-user shell because the stock
# /etc/rc.conf ships rc_configured=NO and /etc/rc refuses to continue
# without it.  Configuring rc.conf is what turns the same distribution
# into a system that runs /etc/rc and puts a getty on every tty marked
# `on' in /etc/ttys -- the serial console and the display console both.
customize() {
	customize_penumbra

	cp ${release}/etc/rc.conf ${mnt}/etc/rc.conf
	cat >> ${mnt}/etc/rc.conf << EOF
rc_configured=YES
hostname=penumbra

# rc.subr forks a subshell per rc.d script unless this is set, and a
# fork costs over a second here.  The documented risk is that a script
# calling exit takes the whole boot with it.
rc_fast_and_loose=YES

# No network hardware attached yet.
sshd=NO
dhcpcd=NO

# Nothing to swap to and no dump device, so neither needs to go looking.
no_swap=YES
savecore=NO

# Expensive or pointless on a machine this size.
makemandb=NO
postfix=NO
virecover=NO
dmesg=NO
ldconfig=NO
devpubd=NO
certctl_init=NO
EOF

	# set.etc describes rc.conf with the stock file's size, and makefs
	# copies only that many bytes.  Re-declaring it without a size is what
	# lets the longer file through.
	echo "./etc/rc.conf type=file uname=root gname=wheel mode=0644" \
	    >> "$tmp/selected_sets"

	# The stock sysctl.conf turns off debugger entry on panic, which suits
	# a machine expected to reboot unattended.  This one is meant to be
	# debugged, so a panic should stop in ddb with the state intact.  The
	# existing assignment is commented out rather than edited so there is
	# exactly one live setting and the boot reports a single transition.
	sed -e 's/^ddb\.onpanic/#&/' ${release}/etc/sysctl.conf \
	    > ${mnt}/etc/sysctl.conf
	cat >> ${mnt}/etc/sysctl.conf << EOF

# Stop in the debugger on panic rather than rebooting.
ddb.onpanic=1
EOF
	echo "./etc/sysctl.conf type=file uname=root gname=wheel mode=0644" \
	    >> "$tmp/selected_sets"
}
