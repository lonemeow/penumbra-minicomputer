# $NetBSD$
# Penumbra guest image customization script used by mkimage
#

board=penumbra_guest

. ${DIR}/conf/penumbra_multiuser.conf

# A machine for guests to log into over the network: the multiuser
# image with a DHCP client, telnetd, and an account for them.
#
# root's account is the distribution's, whatever password it has, and a
# guest does not reach it: login(1) takes root only on a tty marked
# `secure' in /etc/ttys, which a network login's pty is not, and su(1)
# takes only members of wheel to root.
#
# telnet carries everything in the clear, passwords included, and a
# guest's shell is a shell on whatever network the machine is plugged
# into.

# The host tool that builds the password databases, as mkimage names
# its others.
PWD_MKDB=${TOOL_PWD_MKDB:-pwd_mkdb}

# The guest account's password, as master.passwd(5) holds one:
#   *      none that works: nobody logs in as guest until root gives
#          the account a password with passwd(1), on the machine
#   empty  none asked for: anyone who reaches the machine is let in
#   a hash from pwhash(1), run on the machine
# It is read from the environment, where a hash's `$' signs survive
# make untouched:
#   guest_pwhash='...' make image FLAVOR=guest
: "${guest_pwhash=*}"

# The guest account's line in master.passwd(5):
#   name:password:uid:gid:class:change:expire:gecos:home_dir:shell
# The home directory is made from it below, with the dot files of
# /etc/skel, and belongs to its uid and gid.
guest_entry="guest:${guest_pwhash}:1000:100::0:0:Guest user:/home/guest:/bin/sh"

customize() {
	customize_penumbra_multiuser

	customize_guest_network
	customize_guest_account
}

customize_guest_network() {
	# rc.conf is read top to bottom, so these take over from the
	# multiuser image's settings above them.  The file's spec entry is
	# already re-declared there.
	cat >> ${mnt}/etc/rc.conf << EOF

# On the network.  -b sends dhcpcd to the background at once: the boot
# does not wait for a lease, and dhcpcd, with no limit on its wait,
# goes on asking for one for as long as it takes.
dhcpcd=YES
dhcpcd_flags="-qMb"

# For telnetd, which inetd.conf has it run.
inetd=YES
EOF

	# The stock telnet line asks for `-a valid', which turns away every
	# client that does not authenticate itself, an ordinary one among
	# them; without it telnetd runs login(1).
	sed -e '/^#telnet[[:space:]].*[[:space:]]tcp[[:space:]]/{' \
	    -e 's/^#//' -e 's/[[:space:]]*-a valid$//' -e '}' \
	    ${release}/etc/inetd.conf > ${mnt}/etc/inetd.conf
	if [ "$(grep -c '^telnet[[:space:]]' ${mnt}/etc/inetd.conf)" != 1 ] ||
	    grep -q '^telnet.*-a' ${mnt}/etc/inetd.conf; then
		echo ${PROG}: no telnet line to enable in \
		    ${release}/etc/inetd.conf 1>&2
		exit 1
	fi
	echo "./etc/inetd.conf type=file uname=root gname=wheel mode=0644" \
	    >> "$tmp/selected_sets"
}

customize_guest_account() {
	local name pw uid gid class change expire gecos home shell
	local dir parent f

	IFS=: read -r name pw uid gid class change expire gecos home shell \
	    << EOF
${guest_entry}
EOF
	if [ -z "${shell}" ]; then
		echo ${PROG}: the guest account needs all ten fields of a \
		    master.passwd line: "'${guest_entry}'" 1>&2
		exit 1
	fi
	if [ ! -x "${release}${shell}" ]; then
		echo ${PROG}: the guest account\'s shell is not in the \
		    image: ${shell} 1>&2
		exit 1
	fi

	echo "${bar} adding the ${name} account ${bar}"
	cp ${release}/etc/master.passwd ${mnt}/etc/master.passwd
	printf '%s\n' "${guest_entry}" >> ${mnt}/etc/master.passwd

	# The databases login(1) reads, and the passwd file made from the
	# same lines.  -L: the machine is little-endian.
	if ! ${PWD_MKDB} -L -p -d ${mnt} ${mnt}/etc/master.passwd; then
		echo ${PROG}: ${PWD_MKDB} refused the guest account: \
		    "'${guest_entry}'" 1>&2
		exit 1
	fi
	cat >> "$tmp/selected_sets" << EOF
./etc/master.passwd type=file uname=root gname=wheel mode=0600
./etc/passwd type=file uname=root gname=wheel mode=0644
./etc/pwd.db type=file uname=root gname=wheel mode=0644
./etc/spwd.db type=file uname=root gname=wheel mode=0600
EOF

	# The home directory, under whatever the sets do not already
	# carry of its path.  The account is not in the password database
	# makefs resolves names with, so its files go by number.
	parent=
	for dir in $(echo "${home%/*}" | tr / ' '); do
		parent="${parent}/${dir}"
		if [ ! -d "${release}${parent}" ]; then
			mkdir -p "${mnt}${parent}"
			echo ".${parent} type=dir uname=root gname=wheel" \
			    "mode=0755" >> "$tmp/selected_sets"
		fi
	done
	mkdir -p "${mnt}${home}"
	echo ".${home} type=dir uid=${uid} gid=${gid} mode=0755" \
	    >> "$tmp/selected_sets"
	for f in ${release}/etc/skel/.[!.]*; do
		cp "${f}" "${mnt}${home}/"
		echo ".${home}/${f##*/} type=file uid=${uid} gid=${gid}" \
		    "mode=0644" >> "$tmp/selected_sets"
	done
}
