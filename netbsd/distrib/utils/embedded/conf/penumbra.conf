# $NetBSD$
# Penumbra customization script used by mkimage
#

board=penumbra
image=$HOME/${board}.img

MACHINE=penumbra
MKDTB=no		# the port carries no device tree

# Geometry is expressed in units of 1024 sectors (512 KiB).  The values
# reproduce the layout the boot ROM scans for: a FAT32 partition holding
# PENBOOT.ELF starting at sector 2048, with the FFS root directly after
# it.
#
# The boot partition is far larger than the handful of megabytes the boot
# files occupy.  The ROM reads FAT32 only, FAT32 needs at least 65525
# clusters, and makefs picks cluster sizes no smaller than two sectors on
# its own, which puts the smallest FAT32 it will build just above 64 MB.
extra=8			# spare space
init=2			# FAT32 starts at sector 2048
boot=132		# 66 MB FAT32 boot partition
ffsoffset=$(( (${init} + ${boot}) / 2 ))m
size=0			# autocompute
msdosid=11		# FAT32 with LBA addressing
rootdev=ld

# Fragment and block size of the root filesystem, matching the makefs
# options mkimage builds it with.  make_label reports them back to the
# kernel through the disklabel.
fsize=8192
bsize=65536

# mkimage builds the FAT32 filesystem out of ${mnt}/boot.
mkdir -p ${mnt}/boot

# The bootloader and kernel are built outside the NetBSD objdir layout,
# so both are overridable from the environment.
: ${penboot:=${src}/sys/arch/penumbra/stand/boot/PENBOOT.ELF}
: ${kernel:=${src}/sys/arch/penumbra/compile/GENERIC/netbsd}

# Locally built content added to the image, both optional:
#   rootoverlay  a fake-root tree merged into the FFS root, each file
#                landing at the path it occupies under the tree
#   bootextras   files copied to the FAT32 root beside PENBOOT.ELF, so
#                the ROM can boot them directly
: ${rootoverlay:=}
: ${bootextras:=}

make_fstab() {
	cat > ${mnt}/etc/fstab << EOF
# NetBSD /etc/fstab
# See /usr/share/examples/fstab/ for more examples.
/dev/${rootdev}0f	/		ffs	rw	1 1
ptyfs			/dev/pts	ptyfs	rw
EOF
	echo "./etc/fstab type=file uname=root gname=wheel mode=0644" \
	    >> "$tmp/selected_sets"
}

customize() {
	customize_penumbra
}

# Split out so images derived from this one can extend it rather than
# restate it; see penumbra_multiuser.conf.
customize_penumbra() {
	if [ ! -f ${release}/dev/MAKEDEV ]; then
		echo ${PROG}: Missing ${release}/dev/MAKEDEV 1>&2
		exit 1
	fi
	echo "${bar} running MAKEDEV ${bar}"
	# MAKEDEV -s writes specs relative to /dev; reroot them.  Which nodes
	# `all' covers is the port's business, declared in etc.penumbra.
	MACHINE=${MACHINE} ${HOST_SH} ${release}/dev/MAKEDEV -s all \
	    | sed -e 's:^\./:\./dev/:' \
	    >> "$tmp/selected_sets"
}

populate() {
	if [ ! -f ${penboot} ]; then
		echo ${PROG}: Missing ${penboot} 1>&2
		exit 1
	fi
	if [ ! -f ${kernel} ]; then
		echo ${PROG}: Missing ${kernel} 1>&2
		exit 1
	fi

	echo "${bar} populating boot partition ${bar}"
	# The ROM loads PENBOOT.ELF from the FAT32 root; PENBOOT then reads
	# boot.cfg and loads the kernel beside it.
	cp ${penboot} ${mnt}/boot/PENBOOT.ELF
	cp ${kernel} ${mnt}/boot/netbsd
	echo "root=${rootdev}0f" > ${mnt}/boot/boot.cfg

	# A second copy on the root filesystem, where userland expects it.
	cp ${kernel} ${mnt}/netbsd
	echo "./netbsd type=file uname=root gname=wheel mode=0644" \
	    >> "$tmp/selected_sets"

	if [ -n "${bootextras}" ]; then
		if [ ! -d "${bootextras}" ]; then
			echo ${PROG}: Missing ${bootextras} 1>&2
			exit 1
		fi
		echo "${bar} adding boot partition extras ${bar}"
		cp -r "${bootextras}/." ${mnt}/boot/
	fi

	if [ -n "${rootoverlay}" ]; then
		if [ ! -d "${rootoverlay}" ]; then
			echo ${PROG}: Missing ${rootoverlay} 1>&2
			exit 1
		fi
		echo "${bar} overlaying ${rootoverlay} ${bar}"
		overlay_tree "${rootoverlay}"
	fi
}

# Merge a fake-root tree into the root filesystem.  makefs builds the
# image from the spec in $tmp/selected_sets rather than from whatever
# happens to be in ${mnt}, so every file copied in needs a spec entry of
# its own, as does every directory the tree introduces — the sets carry
# no /usr/local, for instance.  A copied file with no entry is silently
# left out of the image.
overlay_tree() {
	local tree="$1" f mode type

	# find runs inside the tree so it prints the ./usr/local/bin/foo form
	# the spec wants, parents before their contents.
	for f in $(cd "$tree" && find .); do
		[ "$f" = "." ] && continue

		if [ -d "$tree/$f" ]; then
			mkdir -p "$mnt/$f"
			mode=0755
			type=dir
		else
			cp "$tree/$f" "$mnt/$f"
			if [ -x "$tree/$f" ]; then
				mode=0755
			else
				mode=0644
			fi
			type=file
		fi
		echo "$f type=$type uname=root gname=wheel mode=$mode" >> ${tmp}/selected_sets
	done
}

make_label() {
	# All sizes in sectors.
	local totalsize=$(( ${size} / 512 ))
	local bootoffset=$(( ${init} * 1024 ))
	local bootsize=$(( ${boot} * 1024 ))
	local rootoffset=$(( ${bootoffset} + ${bootsize} ))
	local rootsize=$(( ${totalsize} - ${rootoffset} ))

	local bps=512
	local spt=32
	local tpc=64
	local spc=2048
	local cylinders=$(( ${totalsize} / ${spc} ))

	cat << EOF
type: SCSI
disk: STORAGE DEVICE
label: fictitious
flags: removable
bytes/sector: ${bps}
sectors/track: ${spt}
tracks/cylinder: ${tpc}
sectors/cylinder: ${spc}
cylinders: ${cylinders}
total sectors: ${totalsize}
rpm: 3600
interleave: 1
trackskew: 0
cylinderskew: 0
headswitch: 0           # microseconds
track-to-track seek: 0  # microseconds
drivedata: 0

6 partitions:
#        size        offset        fstype [fsize bsize cpg/sgs]
 c: ${totalsize}             0     unused      0     0
 e:  ${bootsize}  ${bootoffset}     MSDOS
 f:  ${rootsize}  ${rootoffset}    4.2BSD ${fsize} ${bsize} 0
EOF
}
