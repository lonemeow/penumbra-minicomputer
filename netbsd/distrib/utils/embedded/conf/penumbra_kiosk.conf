# $NetBSD$
# Penumbra exhibit image customization script used by mkimage
#

board=penumbra_kiosk

. ${DIR}/conf/penumbra.conf

# An unattended machine showing itself off to visitors.  The display and
# its keyboard are the whole interface, and the machine is expected to be
# switched on in front of an audience, so what it does between power and
# a menu matters as much as what it offers afterwards.
#
# It derives from the base image rather than the multiuser one: the stock
# /etc/rc is replaced here, so none of the service configuration that
# makes /etc/rc behave would ever be read.
customize() {
	customize_penumbra

	# init runs `sh /etc/rc autoboot' and falls back to single user on a
	# non-zero exit, so the stock machinery can be replaced wholesale as
	# long as this ends in exit 0.  The stock script walks all 130
	# scripts in /etc/rc.d, which at this clock rate is minutes of work
	# to start services an exhibit does not run.
	cat > ${mnt}/etc/rc << 'EOF'
#
#	$NetBSD$
#
# Exhibit init: bring the filesystems up and get out of the way.  init
# starts the launcher from /etc/ttys once this exits.

export HOME=/
export PATH=/sbin:/bin:/usr/sbin:/usr/bin
umask 022

# The kernel mounts root read-only; the shell and anything a visitor
# runs expect to be able to write.
mount -u -o rw /

# /dev/pts, per the fstab this image ships.
mount /dev/pts

hostname penumbra

# login(1) and who(1) expect these to exist if a visitor opens a shell.
for f in /var/run/utmp /var/run/utmpx; do
	if [ ! -f $f ]; then
		: > $f
		chmod 644 $f
	fi
done

exit 0
EOF
	echo "./etc/rc type=file uname=root gname=wheel mode=0644" \
	    >> "$tmp/selected_sets"

	# Written out rather than edited from the stock file: which terminal
	# does what is the whole shape of this image, and belongs somewhere
	# it can be read at a glance.
	cat > ${mnt}/etc/ttys << 'EOF'
#
#	$NetBSD$
#
# name	getty				type	status		comments

# Console pseudo-devices; the real terminals are named below.
console	"/usr/libexec/getty default"	vt100	off secure
constty	"/usr/libexec/getty default"	vt100	off secure

# The launcher runs the status monitor on the serial port and has to be
# free to stop it for entries that need the machine to themselves, so it
# gets no getty competing for the same terminal.  Quitting the monitor is
# how an operator gets a shell there.
tty00	"/usr/libexec/getty default"	vt100	off secure

# The display is the exhibit.  init respawns the launcher on exit exactly
# as it would a login, so a crash recovers on its own.
ttyE0	"/usr/local/bin/exhibit-launcher"	wsvt25	on secure
ttyE1	"/usr/libexec/getty default"	wsvt25	off secure
EOF
	echo "./etc/ttys type=file uname=root gname=wheel mode=0644" \
	    >> "$tmp/selected_sets"

	# sysctl.conf is left as the distribution ships it, which disables
	# debugger entry on panic: an exhibit machine should come back by
	# itself rather than wait at a prompt for someone who is not there.
}
