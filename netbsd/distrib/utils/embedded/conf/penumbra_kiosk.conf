# $NetBSD$
# Penumbra exhibit image customization script used by mkimage
#

board=penumbra_kiosk

. ${DIR}/conf/penumbra_multiuser.conf

# An unattended machine showing itself off to visitors.  It reaches
# multiuser the same way the development image does, and differs in who
# is expected to be sitting at it: the display and its keyboard are the
# whole interface, and nobody is going to read a debugger prompt.
customize() {
	customize_multiuser

	# Written out rather than edited from the stock file: which terminal
	# does what is the whole shape of this image, and belongs somewhere
	# it can be read at a glance.
	cat > ${mnt}/etc/ttys << 'EOF'
#
#	$NetBSD$
#
# name	getty				type	status		comments

# Console pseudo-devices; the real terminals are named below.
console	"/usr/libexec/getty default"	vt100	off secure
constty	"/usr/libexec/getty default"	vt100	off secure

# The launcher runs the status monitor on the serial port and has to be
# free to stop it for entries that need the machine to themselves, so it
# gets no getty competing for the same terminal.  Quitting the monitor is
# how an operator gets a shell there.
tty00	"/usr/libexec/getty default"	vt100	off secure

# The display is the exhibit.  init respawns the launcher on exit exactly
# as it would a login, so a crash recovers on its own.
ttyE0	"/usr/local/bin/exhibit-launcher"	wsvt25	on secure
ttyE1	"/usr/libexec/getty default"	wsvt25	off secure
EOF
	echo "./etc/ttys type=file uname=root gname=wheel mode=0644" \
	    >> "$tmp/selected_sets"

	# sysctl.conf is left as the distribution ships it, which disables
	# debugger entry on panic: an exhibit machine should come back by
	# itself rather than wait at a prompt for someone who is not there.
}
