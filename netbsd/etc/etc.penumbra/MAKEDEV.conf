# $NetBSD$

# Penumbra minicomputer: serial console + SD block device.

init)
	makedev std ld0 ld1 sd0 sd1
	makedev tty00
	makedev bpf
	makedev random
	makedev md0
	makedev ipty
	makedev local
	;;

all_md)
	makedev sd0 sd1 sd2 sd3
	makedev tty00 tty01
	makedev ld0 ld1
	;;

minimal)
	makedev std ld0
	makedev sd0
	makedev tty00
	;;
