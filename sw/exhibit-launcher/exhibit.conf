# exhibit.conf — what the exhibit machine offers visitors.
#
# Edited in place on the running machine; the launcher reads it at
# startup, so changing the menu for a different audience means editing
# this file and restarting the launcher, not rebuilding anything.
#
# Directives:
#   monitor <device> <command...>
#   shell   <command...>          replaces the monitor when it exits
#   idle    <seconds>             0 disables the attract loop
#   hold    <seconds>             how long a finished picture stays up
#   attract <command...>          cycled while nobody is at the keyboard
#   entry   <flags> "<label>" <command...>
#
# Entry flags are a word of letters, or '-' for none:
#
#   x  gets the machine to itself: the monitor is stopped while it runs
#      and started again afterwards.  Use it for anything whose timing
#      suffers from the monitor sampling counters and writing to a
#      serial line.
#   p  draws once and exits, so its result is held on screen until a
#      visitor presses a key or `hold' seconds pass.  Leave it off for programs that run until
#      a keypress themselves; they would ask twice.
#
# A program that changes the display mode is responsible for putting it
# back before it exits — the launcher restores the terminal it owns, but
# it cannot know what mode a program switched into or how to leave it.

# The status display, on the serial port.  Its size is measured at
# startup, so a different terminal needs no change here.
monitor	/dev/tty00 /usr/local/bin/penmon

# What an operator gets on the serial port after quitting the monitor.
shell	/bin/sh

# Return to the attract loop after this long with nobody pressing keys.
idle	120

# How long a picture from a `p' entry stays up before the menu returns.
hold	15

# The graphics demos hold or time-bound themselves, so they carry no
# `p': a program that ends by itself must not also be paused after, or
# a visitor waits through two holds.  `-H' is how long a finished
# picture stays up, `-t' how long a demo that never finishes runs for.
# pbench keeps `p' — it prints and exits, which is what `p' is for.
entry	-  "Mandelbrot"		/usr/local/bin/mandelbrot -H 15
entry	-  "Julia set"		/usr/local/bin/julia -H 15
entry	-  "Plasma"		/usr/local/bin/plasma -t 20
entry	-  "Lorenz attractor"	/usr/local/bin/lorenz -t 20
entry	-  "Shade bobs"		/usr/local/bin/shadebobs -t 20
entry	xp "Benchmarks"		/usr/local/bin/pbench
entry	x  "Shell"		/bin/sh

# Shown when the machine is left alone, in this order.  The launcher
# advances when a program exits, so each needs its own bound or the
# first one shown is the only one ever shown.
attract	/usr/local/bin/penumbra-text -t 20
attract	/usr/local/bin/plasma -t 20
attract	/usr/local/bin/lorenz -t 20
